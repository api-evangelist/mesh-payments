apis:
- name: Mesh Payments API
  description: 'RESTful API for the Mesh spend management platform. Documented capabilities
    include connectivity verification, virtual card lifecycle management (issuance,
    suspension, cancellation), merchant and category limitation configuration, metadata
    tagging for tracking, authorization and settlement data retrieval, and real-time
    account balance access. Authentication is HMAC-SHA256 request signing or OAuth
    2.0 client credentials. Full endpoint reference and code samples (Python, Node.js,
    Java, C#, PHP) are published on the Mesh Developers Portal, which is served behind
    HTTP Basic authentication.'
  humanURL: https://developers.meshpayments.com
  baseURL: https://api.meshpayments.com
  tags:
  - Payments
  - Corporate Cards
  - Card Issuing
  - Spend Management
  properties:
  - type: Documentation
    url: https://developers.meshpayments.com
  - type: Authentication
    url: authentication/mesh-payments-authentication.yml
  - type: OAuthScopes
    url: scopes/mesh-payments-scopes.yml
  - type: Webhooks
    url: asyncapi/mesh-payments-webhooks.yml
- name: Mesh Payments MCP Server
  description: 'OAuth-protected Model Context Protocol (MCP) server operated by Mesh
    at api.meshpayments.com/mcp. The endpoint advertises RFC 9728 OAuth 2.0 Protected
    Resource Metadata at /.well-known/oauth-protected-resource/mcp and challenges
    unauthenticated JSON-RPC calls with a WWW-Authenticate Bearer header. Mesh describes
    its orchestration layer as MCP-compatible so customers can connect their own AI
    agents and build workflows on top of Mesh policy governance.'
  humanURL: https://meshpayments.com/orchestration/
  baseURL: https://api.meshpayments.com/mcp
  tags:
  - MCP
  - Agents
  - Spend Management
  properties:
  - type: MCPServer
    url: mcp/mesh-payments-mcp.yml
