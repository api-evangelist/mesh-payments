aid: mesh-payments
name: Mesh Payments
description: 'Mesh Payments is a global travel and expense (T&E) and spend management
  platform for finance teams, combining corporate virtual and physical card issuing,
  expense management, accounts payable, procurement (ProcurePay), travel booking and
  accounting automation in a single system. Mesh exposes a RESTful API on api.meshpayments.com
  for virtual card lifecycle management, merchant and category controls, metadata tagging,
  authorization and settlement retrieval and real-time balance queries, authenticated
  with either HMAC-SHA256 request signing or OAuth 2.0 client credentials. It also
  publishes an OAuth-protected Model Context Protocol (MCP) server at api.meshpayments.com/mcp
  and a configurable webhooks surface, plus ERP, HRIS and TMC integrations.'
image: https://meshpayments.com/wp-content/uploads/2026/05/meshpayments.png
url: https://raw.githubusercontent.com/api-evangelist/mesh-payments/refs/heads/main/apis.yml
